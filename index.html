<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DTR Progress Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0A0A0D;
  --surface:#0F0F13;
  --border:rgba(255,255,255,.07);
  --gold:#F5C842;
  --gold-dim:rgba(245,200,66,.12);
  --t1:#EDEAE0;
  --t2:#72727A;
  --t3:#35353C;
  --green:#22C55E;
  --red:#EF4444;
}

html,body{height:100%;overflow:hidden;background:var(--bg);}

body{
  font-family:'Plus Jakarta Sans',sans-serif;
  color:var(--t1);
  display:flex;
}

/* ── LAYOUT ── */
.wrap{display:flex;width:100vw;height:100vh;}

/* ── LEFT ── */
.left{
  flex:1;
  display:flex;flex-direction:column;
  padding:44px 52px;
  position:relative;
  overflow:hidden;
}

.left::after{
  content:'';
  position:absolute;right:0;top:0;bottom:0;width:1px;
  background:var(--border);
}

/* Logo */
.logo{
  display:flex;align-items:center;gap:10px;
  opacity:0;animation:up .5s .05s ease forwards;
}
.logo-mark{
  width:32px;height:32px;border-radius:8px;
  background:var(--gold-dim);
  border:1px solid rgba(245,200,66,.18);
  display:grid;place-items:center;
}
.logo-mark svg{display:block;}
.logo-name{
  font-size:14px;font-weight:700;
  letter-spacing:-.01em;
}
.logo-name em{color:var(--gold);font-style:normal;}

/* Center content */
.left-body{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  gap:56px;
}

/* Big stat */
.big-stat{
  opacity:0;animation:up .6s .15s ease forwards;
}
.big-stat-num{
  font-family:'JetBrains Mono',monospace;
  font-size:clamp(48px,5.5vw,72px);
  font-weight:400;
  letter-spacing:-.04em;
  color:var(--t1);
  line-height:1;
  margin-bottom:12px;
}
.big-stat-num .hl{color:var(--gold);}
.big-stat-label{
  font-size:13px;font-weight:500;
  color:var(--t2);
  letter-spacing:-.01em;
}

/* Activity feed */
.feed{
  display:flex;flex-direction:column;gap:0;
  opacity:0;animation:up .6s .25s ease forwards;
}
.feed-title{
  font-size:11px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;
  color:var(--t3);
  margin-bottom:16px;
}
.feed-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 0;
  border-bottom:1px solid var(--border);
  transition:opacity .3s;
}
.feed-item:last-child{border-bottom:none;}
.feed-avatar{
  width:28px;height:28px;border-radius:7px;
  background:var(--surface);
  border:1px solid var(--border);
  display:grid;place-items:center;
  font-size:11px;font-weight:700;
  color:var(--t2);
  flex-shrink:0;
}
.feed-text{flex:1;min-width:0;}
.feed-name{
  font-size:13px;font-weight:600;
  color:var(--t1);
  letter-spacing:-.01em;
  margin-bottom:1px;
}
.feed-action{
  font-size:12px;color:var(--t2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.feed-action .skill{color:var(--t1);font-weight:600;}
.feed-time{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;color:var(--t3);
  flex-shrink:0;
}
.feed-hours{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;font-weight:500;
  color:var(--gold);
  flex-shrink:0;
}

/* Bottom stats row */
.stats-row{
  display:flex;gap:32px;
  opacity:0;animation:up .6s .32s ease forwards;
}
.stat{display:flex;flex-direction:column;gap:4px;}
.stat-val{
  font-family:'JetBrains Mono',monospace;
  font-size:20px;font-weight:500;
  letter-spacing:-.03em;color:var(--t1);
}
.stat-lbl{
  font-size:11px;font-weight:500;
  color:var(--t2);letter-spacing:-.01em;
}

/* ── RIGHT ── */
.right{
  width:400px;flex-shrink:0;
  display:flex;flex-direction:column;
  justify-content:center;
  padding:48px 44px;
  background:var(--surface);
}

/* Form header */
.form-header{
  margin-bottom:36px;
  opacity:0;animation:up .5s .08s ease forwards;
}
.form-title{
  font-size:22px;font-weight:800;
  letter-spacing:-.03em;
  margin-bottom:4px;
}
.form-sub{
  font-size:13px;color:var(--t2);
  letter-spacing:-.01em;
}

/* Tabs */
.tabs{
  display:flex;gap:4px;
  background:rgba(255,255,255,.04);
  border-radius:10px;padding:3px;
  margin-bottom:32px;
  opacity:0;animation:up .5s .13s ease forwards;
}
.tab{
  flex:1;background:none;border:none;cursor:pointer;
  padding:9px 0;border-radius:8px;
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:13px;font-weight:600;
  color:var(--t2);
  transition:all .2s;
  letter-spacing:-.01em;
}
.tab.on{
  background:rgba(255,255,255,.08);
  color:var(--t1);
}

/* Error */
.err-msg{
  display:none;
  font-size:12px;color:var(--red);
  margin-bottom:16px;
  padding:10px 12px;
  background:rgba(239,68,68,.07);
  border-radius:8px;
  border:1px solid rgba(239,68,68,.14);
}
.err-msg.on{display:block;}

/* Panes */
.pane{display:none;}
.pane.on{display:block;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Fields */
.field{
  margin-bottom:20px;
  opacity:0;animation:up .5s ease forwards;
}
.pane.on .field:nth-child(1){animation-delay:.18s}
.pane.on .field:nth-child(2){animation-delay:.24s}
.pane.on .field:nth-child(3){animation-delay:.30s}

.field-label{
  font-size:11px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;
  color:var(--t2);
  display:block;margin-bottom:8px;
}

.field-inner{position:relative;}

.field-input{
  width:100%;
  background:rgba(255,255,255,.04);
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px 40px 12px 14px;
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:14px;font-weight:500;
  color:var(--t1);
  outline:none;
  letter-spacing:-.01em;
  transition:border-color .2s,background .2s;
}
.field-input::placeholder{color:var(--t3);}
.field-input:focus{
  border-color:rgba(245,200,66,.35);
  background:rgba(245,200,66,.025);
}

.eye-btn{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;
  color:var(--t3);padding:2px;
  transition:color .2s;
  line-height:0;
}
.eye-btn:hover{color:var(--t2);}

/* strength */
.str-row{display:flex;gap:4px;margin-top:6px;}
.str-seg{flex:1;height:2px;border-radius:1px;background:var(--t3);transition:background .25s;}

/* 2-col */
.field-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

/* Buttons */
.btn-go{
  width:100%;
  background:var(--gold);
  border:none;border-radius:10px;
  padding:14px;
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:14px;font-weight:700;
  letter-spacing:-.01em;
  color:#0A0800;
  cursor:pointer;
  transition:opacity .15s,transform .12s;
  margin-bottom:10px;
  opacity:0;animation:up .5s .34s ease forwards;
}
.btn-go:hover{opacity:.88;}
.btn-go:active{transform:scale(.985);}
.btn-go.busy{opacity:.45;pointer-events:none;}

.btn-demo{
  width:100%;background:none;
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:13px;font-weight:600;
  color:var(--t2);letter-spacing:-.01em;
  cursor:pointer;
  transition:border-color .2s,color .2s;
  display:flex;align-items:center;justify-content:center;gap:7px;
  opacity:0;animation:up .5s .38s ease forwards;
}
.btn-demo:hover{border-color:rgba(255,255,255,.14);color:var(--t1);}
.blink{
  width:5px;height:5px;border-radius:50%;
  background:var(--green);
  animation:blink 2s ease infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* online badge */
.online-badge{
  position:absolute;bottom:32px;right:0;left:0;
  text-align:center;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;color:var(--t3);
  letter-spacing:.06em;
  opacity:0;animation:up .5s .5s ease forwards;
}

@keyframes up{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}

@media(max-width:820px){
  html,body{overflow:auto;}
  .wrap{flex-direction:column;height:auto;}
  .left{display:none;}
  .right{width:100%;min-height:100vh;padding:60px 28px;}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- LEFT -->
  <div class="left">

    <div class="logo">
      <div class="logo-mark">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <rect x="2" y="9" width="3" height="5" rx="1" fill="#F5C842"/>
          <rect x="6.5" y="5" width="3" height="9" rx="1" fill="#F5C842" opacity=".7"/>
          <rect x="11" y="2" width="3" height="12" rx="1" fill="#F5C842" opacity=".4"/>
        </svg>
      </div>
      <div class="logo-name">DTR <em>Progress</em> Club</div>
    </div>

    <div class="left-body">

      <div class="big-stat">
        <div class="big-stat-num">
          <span id="bigN">0</span><span class="hl"> ч</span>
        </div>
        <div class="big-stat-label">часов вложено сообществом в себя</div>
      </div>

      <div class="feed">
        <div class="feed-title">Прямо сейчас</div>
        <div id="feedList"></div>
      </div>

      <div class="stats-row">
        <div class="stat">
          <div class="stat-val" id="sUsers">—</div>
          <div class="stat-lbl">участников</div>
        </div>
        <div class="stat">
          <div class="stat-val" id="sLeagues">—</div>
          <div class="stat-lbl">активных лиг</div>
        </div>
        <div class="stat">
          <div class="stat-val" id="sOnline" style="color:var(--green)">—</div>
          <div class="stat-lbl">online сейчас</div>
        </div>
      </div>

    </div>
  </div>

  <!-- RIGHT -->
  <div class="right" style="position:relative;">

    <div class="form-header">
      <div class="form-title">Добро пожаловать</div>
      <div class="form-sub">Войди и продолжи прокачку</div>
    </div>

    <div class="tabs">
      <button class="tab on" id="tL" onclick="sw('l')">Войти</button>
      <button class="tab" id="tR" onclick="sw('r')">Регистрация</button>
    </div>

    <div class="err-msg" id="err"></div>

    <!-- LOGIN -->
    <div class="pane on" id="pL">
      <div class="field">
        <label class="field-label">Никнейм</label>
        <div class="field-inner">
          <input class="field-input" id="lN" type="text" placeholder="твой_никнейм" autocomplete="username" spellcheck="false">
        </div>
      </div>
      <div class="field">
        <label class="field-label">Пароль</label>
        <div class="field-inner">
          <input class="field-input" id="lP" type="password" placeholder="········" autocomplete="current-password">
          <button class="eye-btn" onclick="eye('lP',this)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button class="btn-go" id="bL" onclick="doLogin()">Войти</button>
      <button class="btn-demo" onclick="doDemo()"><div class="blink"></div> Демо-аккаунт</button>
    </div>

    <!-- REGISTER -->
    <div class="pane" id="pR">
      <div class="field-pair">
        <div class="field">
          <label class="field-label">Никнейм</label>
          <input class="field-input" id="rN" type="text" placeholder="nickname" spellcheck="false" style="padding-right:14px">
        </div>
        <div class="field">
          <label class="field-label">Имя</label>
          <input class="field-input" id="rNm" type="text" placeholder="Имя" style="padding-right:14px">
        </div>
      </div>
      <div class="field">
        <label class="field-label">Пароль</label>
        <div class="field-inner">
          <input class="field-input" id="rP" type="password" placeholder="минимум 8 символов" autocomplete="new-password" oninput="str(this.value)">
          <button class="eye-btn" onclick="eye('rP',this)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="str-row" id="strRow">
          <div class="str-seg" id="s0"></div><div class="str-seg" id="s1"></div>
          <div class="str-seg" id="s2"></div><div class="str-seg" id="s3"></div>
        </div>
      </div>
      <button class="btn-go" id="bR" onclick="doReg()">Создать аккаунт</button>
      <button class="btn-demo" onclick="doDemo()"><div class="blink"></div> Демо-аккаунт</button>
    </div>

    <div class="online-badge" id="ob">247 человек онлайн</div>

  </div>
</div>

<script>
/* FEED DATA */
var feedData=[
  {init:'АК', name:'alex_k',    skill:'Программирование', hours:'2ч 14м', ago:'1 мин'},
  {init:'МВ', name:'masha_v',   skill:'Английский',       hours:'45м',    ago:'3 мин'},
  {init:'ДТ', name:'d_trader',  skill:'Трейдинг',         hours:'1ч 30м', ago:'5 мин'},
  {init:'ИС', name:'ivan_s',    skill:'Чтение',           hours:'1ч',     ago:'7 мин'},
  {init:'НП', name:'nina_p',    skill:'Испанский',        hours:'30м',    ago:'9 мин'},
];

function renderFeed(){
  var el=document.getElementById('feedList');
  el.innerHTML=feedData.map(function(f){
    return '<div class="feed-item">'+
      '<div class="feed-avatar">'+f.init+'</div>'+
      '<div class="feed-text">'+
        '<div class="feed-name">'+f.name+'</div>'+
        '<div class="feed-action">логал <span class="skill">'+f.skill+'</span></div>'+
      '</div>'+
      '<div class="feed-hours">+'+f.hours+'</div>'+
      '<div class="feed-time">'+f.ago+'</div>'+
    '</div>';
  }).join('');
}
renderFeed();

/* COUNTERS */
function count(el,to,fmt,dur){
  var s=null;
  (function step(ts){
    if(!s)s=ts;
    var p=Math.min((ts-s)/dur,1);
    var e=1-Math.pow(1-p,3);
    var v=Math.round(e*to);
    el.textContent=fmt?v.toLocaleString('ru'):v;
    if(p<1)requestAnimationFrame(step);
    else el.textContent=fmt?to.toLocaleString('ru'):to;
  })(0);
  requestAnimationFrame(function(ts){});
}

setTimeout(function(){
  count(document.getElementById('bigN'),2847293,true,1800);
  count(document.getElementById('sUsers'),4821,false,1400);
  count(document.getElementById('sLeagues'),38,false,1100);
  count(document.getElementById('sOnline'),247,false,1000);
},200);

/* TABS */
function sw(t){
  document.getElementById('tL').classList.toggle('on',t==='l');
  document.getElementById('tR').classList.toggle('on',t==='r');
  document.getElementById('pL').classList.toggle('on',t==='l');
  document.getElementById('pR').classList.toggle('on',t==='r');
  clearErr();
}

/* ERROR */
function showErr(m){var e=document.getElementById('err');e.textContent=m;e.classList.add('on');}
function clearErr(){document.getElementById('err').classList.remove('on');}

/* EYE */
function eye(id,btn){
  var inp=document.getElementById(id);
  inp.type=inp.type==='password'?'text':'password';
  btn.style.color=inp.type==='text'?'var(--gold)':'var(--t3)';
}

/* STRENGTH */
function str(v){
  var sc=0;
  if(v.length>=8)sc++;if(/[A-Z]/.test(v))sc++;
  if(/\d/.test(v))sc++;if(/[^a-zA-Z0-9]/.test(v))sc++;
  var cols=['#EF4444','#F97316','#F5C842','#22C55E'];
  for(var i=0;i<4;i++)document.getElementById('s'+i).style.background=i<sc?cols[sc-1]:'var(--t3)';
}

/* LOGIN */
function doLogin(){
  var n=document.getElementById('lN').value.trim();
  var p=document.getElementById('lP').value;
  if(!n||!p){showErr('Заполни никнейм и пароль');return;}
  var b=document.getElementById('bL');
  b.classList.add('busy');b.textContent='Входим...';
  setTimeout(function(){b.classList.remove('busy');b.textContent='Войти';showErr('Неверный никнейм или пароль');},1600);
}

/* REG */
function doReg(){
  var n=document.getElementById('rN').value.trim();
  var nm=document.getElementById('rNm').value.trim();
  var p=document.getElementById('rP').value;
  if(!n||!nm||p.length<8){showErr('Заполни всё. Пароль — от 8 символов.');return;}
  var b=document.getElementById('bR');
  b.classList.add('busy');b.textContent='Создаём...';
  setTimeout(function(){b.classList.remove('busy');b.textContent='Создать аккаунт';showErr('Этот никнейм уже занят');},1600);
}

/* DEMO */
function doDemo(){
  sw('l');
  setTimeout(function(){
    document.getElementById('lN').value='demo_player';
    document.getElementById('lP').value='demo1234';
    setTimeout(doLogin,150);
  },80);
}

/* ENTER */
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  document.getElementById('pL').classList.contains('on')?doLogin():doReg();
});

/* ONLINE DRIFT */
var on=247;
setInterval(function(){
  on+=Math.round((Math.random()-.45)*3);
  on=Math.max(230,Math.min(on,270));
  document.getElementById('ob').textContent=on+' человек онлайн';
  document.getElementById('sOnline').textContent=on;
},4500);

/* FEED ROTATE */
setInterval(function(){
  feedData.unshift({
    init:['СМ','АР','ВК','ТН'][Math.floor(Math.random()*4)],
    name:['sergey_m','alex_r','vova_k','tanya_n'][Math.floor(Math.random()*4)],
    skill:['Программирование','Чтение','Английский','Трейдинг','Испанский'][Math.floor(Math.random()*5)],
    hours:Math.floor(Math.random()*3+1)+'ч '+Math.floor(Math.random()*59+1)+'м',
    ago:'только что'
  });
  if(feedData.length>5)feedData.pop();
  renderFeed();
},8000);
</script>
</body>
</html>
